<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamSnap</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="256x256" href="/icons/256.png">
<link rel="apple-touch-icon" href="/icons/256.png">
<script>try {
  var a = JSON.parse(localStorage.getItem("ss.appearance") || "{}"), d = document.documentElement.dataset;
  d.color = a.color || "violet"; d.black = a.black ? "1" : "0";
  d.mode = a.mode === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : (a.mode || "dark");
} catch (e) {}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <a href="#/" class="logo"><img src="/icon.svg" alt=""><span>Stream<b>Snap</b></span></a>
  <nav>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/discover/movie" data-nav="discover">Discover</a>
    <a href="#/library" data-nav="library">Library</a>
    <a href="#/live" data-nav="live">Live TV</a>
  </nav>
  <form id="search"><input name="q" type="search" placeholder="Search movies &amp; series" autocomplete="off"></form>
  <button class="iconbtn" id="appFull" title="Fullscreen (F11)" aria-label="Fullscreen"><span data-icon="fullscreen"></span></button>
  <a href="#/settings" class="iconbtn" data-nav="settings" title="Settings" aria-label="Settings"><span data-icon="settings"></span></a>
</header>
<main id="view"></main>

<div id="player" hidden>
  <video id="video" playsinline disableRemotePlayback></video>
  <div class="p-top">
    <button class="pbtn" id="pBack" title="Back (Esc)"><span data-icon="back"></span></button>
    <div><div id="pTitle"></div><div id="pSub"></div></div>
  </div>
  <div id="pStatus" hidden></div>
  <div class="warnbar" id="pWarn" hidden></div>
  <button id="pNext" hidden><span>Next episode ▶</span><small></small></button>
  <aside id="pSide" hidden>
    <div class="side-h"><b>Episodes</b><button class="pbtn" id="pSideClose" title="Close"><span data-icon="close"></span></button></div>
    <select id="pSeason" class="pill"></select>
    <div id="pEpList"></div>
  </aside>
  <div class="p-bottom">
    <div id="pSeek"><div class="buf"></div><div class="fill"></div><div class="thumb"></div><div class="tip" hidden></div></div>
    <div class="p-row">
      <button class="pbtn" id="pPlay" title="Play / pause (Space)"><span data-icon="play"></span></button>
      <button class="pbtn" id="pMute" title="Mute (M)"><span data-icon="volume"></span></button>
      <input id="pVol" type="range" min="0" max="1" step="0.05" value="1">
      <span id="pTime">0:00 / 0:00</span>
      <span class="grow"></span>
      <button class="pbtn" id="pEps" title="Episodes (E)" hidden><span data-icon="list"></span><span>Episodes</span></button>
      <div class="menuwrap"><button class="pbtn" id="pCC" title="Captions (C)"><span data-icon="cc"></span></button><div class="menu" id="pCCMenu" hidden></div></div>
      <div class="menuwrap"><button class="pbtn" id="pQ" title="Quality &amp; sync"><span data-icon="quality"></span><span id="pQLabel">Auto</span></button><div class="menu" id="pQMenu" hidden></div></div>
      <button class="pbtn" id="pExt" title="Open in mpv / VLC" hidden><span data-icon="external"></span></button>
      <button class="pbtn" id="pFull" title="Fullscreen (F)"><span data-icon="fullscreen"></span></button>
    </div>
  </div>
</div>
<div id="livePlayer" hidden>
  <video id="liveVideo" playsinline disableRemotePlayback autoplay></video>
  <div class="lp-top">
    <button class="pbtn" id="lpBack" title="Back (Esc)"><span data-icon="back"></span></button>
    <div><div id="lpName"></div><div id="lpNow"></div></div>
    <span class="grow"></span>
    <button class="pbtn" id="lpFav" title="Favorite"><span data-icon="star"></span></button>
  </div>
  <div id="lpGuide" hidden>
    <div class="lg-list-wrap">
      <div class="lg-head"><b>Channel guide</b><span class="subtle">↑ ↓ to browse · Enter to watch · Esc to close</span></div>
      <div class="lg-bar" id="lgBar"></div>
      <div id="lgList"></div>
    </div>
    <div class="lg-sched-wrap"><button class="pbtn lg-close" id="lgClose" title="Close (Esc)"><span data-icon="close"></span></button><div id="lgSched"></div></div>
  </div>
  <div id="lpStatus" hidden></div>
  <div class="warnbar" id="lpWarn" hidden></div>
  <div class="lp-bottom">
    <div id="lpInfo"></div>
    <div class="lp-btns">
      <button class="pbtn" id="lpPrev" title="Previous channel (↑)"><span data-icon="up"></span></button>
      <button class="pbtn" id="lpNext" title="Next channel (↓)"><span data-icon="down"></span></button>
      <button class="pbtn" id="lpRefresh" title="Refresh stream (R): reconnects and re-aligns picture and sound"><span data-icon="sync"></span></button>
      <button class="pbtn" id="lpMute" title="Mute (M)"><span data-icon="volume"></span></button>
      <button class="pbtn" id="lpFull" title="Fullscreen (F)"><span data-icon="fullscreen"></span></button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<script src="/icons.js"></script>
<script src="/dropdown.js"></script>
<script src="/watch.js"></script>
<script src="/player.js"></script>
<script src="/live.js"></script>
<script src="/app.js"></script>
</body>
</html>
