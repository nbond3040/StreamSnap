<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamSnap</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a href="#/" class="logo">Stream<b>Snap</b></a>
  <nav>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/discover/movie" data-nav="discover">Discover</a>
    <a href="#/library" data-nav="library">Library</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <form id="search"><input name="q" type="search" placeholder="Search movies &amp; series" autocomplete="off"></form>
</header>
<main id="view"></main>
<div id="player" hidden>
  <div class="bar"><button id="closePlayer">✕ Close</button><span id="playerTitle"></span><span id="playerMsg"></span></div>
  <video id="video" controls autoplay></video>
</div>
<div id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
