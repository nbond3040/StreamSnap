<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamSnap</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <a href="#/" class="logo"><img src="/icon.svg" alt=""><span>Stream<b>Snap</b></span></a>
  <nav>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/discover/movie" data-nav="discover">Discover</a>
    <a href="#/library" data-nav="library">Library</a>
  </nav>
  <form id="search"><input name="q" type="search" placeholder="Search movies &amp; series" autocomplete="off"></form>
  <a href="#/settings" class="iconbtn" data-nav="settings" title="Settings">⚙</a>
</header>
<main id="view"></main>

<div id="player" hidden>
  <video id="video" playsinline></video>
  <div class="p-top">
    <button class="pbtn" id="pBack" title="Back (Esc)">←</button>
    <div><div id="pTitle"></div><div id="pSub"></div></div>
  </div>
  <div id="pStatus" hidden></div>
  <button id="pNext" hidden><span>Next episode ▶</span><small></small></button>
  <aside id="pSide" hidden>
    <div class="side-h"><b>Episodes</b><button class="pbtn" id="pSideClose" title="Close">✕</button></div>
    <select id="pSeason" class="pill"></select>
    <div id="pEpList"></div>
  </aside>
  <div class="p-bottom">
    <div id="pSeek"><div class="buf"></div><div class="fill"></div><div class="thumb"></div><div class="tip" hidden></div></div>
    <div class="p-row">
      <button class="pbtn" id="pPlay" title="Play / pause (Space)">▶</button>
      <button class="pbtn" id="pMute" title="Mute (M)">🔊</button>
      <input id="pVol" type="range" min="0" max="1" step="0.05" value="1">
      <span id="pTime">0:00 / 0:00</span>
      <span class="grow"></span>
      <button class="pbtn" id="pEps" title="Episodes (E)" hidden>Episodes</button>
      <div class="menuwrap"><button class="pbtn" id="pCC" title="Captions (C)">CC</button><div class="menu" id="pCCMenu" hidden></div></div>
      <div class="menuwrap"><button class="pbtn" id="pQ" title="Quality">Quality</button><div class="menu" id="pQMenu" hidden></div></div>
      <button class="pbtn" id="pExt" title="Open in mpv / VLC" hidden>↗</button>
      <button class="pbtn" id="pFull" title="Fullscreen (F)">⛶</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<script src="/player.js"></script>
<script src="/app.js"></script>
</body>
</html>
